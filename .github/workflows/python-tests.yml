name: Python tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python analysis/analyze_csv.py sample_data/synthetic_bench_data.csv --sample-rate 50 --output /tmp/summary.json
